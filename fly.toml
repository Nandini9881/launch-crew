app = "launchcrew"
primary_region = "iad"
# SIGTERM to SIGKILL. Covers the 10 s HTTP shutdown and the 15 s worker drain
# in cmd/launchcrew/main.go; Fly's default is 5 s.
kill_timeout = 30

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    timeout = "3s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
